name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: No-ML gate (sponsor requirement)
        run: python scripts/no_ml_gate.py
      - name: Tests (property + attack regression)
        run: pytest -q
      - name: Demo smoke
        run: python -m qtrinetra.cli demo
