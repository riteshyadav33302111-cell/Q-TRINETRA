[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtrinetra"
version = "0.1.0"
description = "Q-Trinetra: Pauli-spectrum threat forensics for teleportation-based Quantum Digital Signatures (SIH 2026, PS 26141)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "stim>=1.12"]

[tool.setuptools.packages.find]
include = ["qtrinetra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
